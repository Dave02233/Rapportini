name: rapportini

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: rapportini-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rapportini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rapportini}
      POSTGRES_DB: ${POSTGRES_DB:-rapportini}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
