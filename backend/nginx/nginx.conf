# =============================================================================
# Reverse proxy davanti a FastAPI (container "api:8000").
# Traffico: client → Cloudflare Tunnel (cloudflared) → questo nginx → api.
# =============================================================================

# --- IP reale del client -----------------------------------------------------
# Senza queste righe nginx vedrebbe solo l'IP di chi gli si collega in locale
# (es. gateway Docker), e il rate limit su /login conterebbe TUTTI sullo stesso IP.
#
# Cloudflare (e cloudflared) mette l'IP vero del browser nell'header
# CF-Connecting-IP. Qui diciamo a nginx: "se la richiesta arriva da uno di
# questi range, sostituisci $remote_addr con il valore di quell'header".
# set_real_ip_from = "fidati solo se arriva da qui" (evita che qualcuno
# falsifichi CF-Connecting-IP chiamando l'origin diretto).
# Lista ufficiale: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Stesso concetto, range IPv6 di Cloudflare
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Rate limit su POST /login -----------------------------------------------
# map: crea la variabile $login_key.
#   - POST  → chiave = IP del client (dopo real_ip), così conti i tentativi per IP
#   - altro → chiave vuota = non conta (GET /login è la pagina HTML della SPA)
map $request_method $login_key {
    POST    $binary_remote_addr;
    default "";
}

# Zona in memoria "login": max ~10MB di stato, max 5 richieste/minuto per chiave.
# rate=5r/m = media di 5 al minuto; il burst sotto ammette picchi brevi.
limit_req_zone $login_key zone=login:10m rate=5r/m;

# --- HTTP :80 → redirect a HTTPS ---------------------------------------------
server {
    listen 80;
    return 301 https://$host$request_uri;
}

# --- HTTPS :443 → proxy verso FastAPI ----------------------------------------
server {
    listen 443 ssl;

    # Certificati montati dal compose (./nginx/certs → /etc/nginx/certs)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Header che nginx passa a FastAPI (utile se un giorno leggi IP/proto in app)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Solo /login: applica il rate limit, poi inoltra all'API.
    # burst=5 nodelay = puoi sforare di 5 richieste subito; oltre → 429.
    # location =  match esatto sul path (non vale /login/altro).
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    # Tutto il resto (API + SPA) senza rate limit
    location / {
        proxy_pass http://api:8000;
    }

    # Se scatta il 429, non mandare la pagina HTML di default di nginx:
    # rispondi JSON con "detail" così frontend e app mobile mostrano lo stesso messaggio.
    error_page 429 = @troppi_tentativi;
    location @troppi_tentativi {
        default_type application/json;
        return 429 '{"detail":"Troppi tentativi di accesso, riprova tra un minuto"}';
    }
}
