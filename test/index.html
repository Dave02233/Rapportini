<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>API bench — Rapportini</title>
  <style>
    body { font-family: Consolas, monospace; margin: 1rem; max-width: 960px; }
    label { display: block; margin-top: 0.5rem; }
    input, select, textarea, button { font: inherit; }
    input[type=text], input[type=password], select { width: 100%; max-width: 40rem; }
    textarea { width: 100%; height: 8rem; }
    pre { background: #111; color: #eee; padding: 0.75rem; overflow: auto; white-space: pre-wrap; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin: 0.5rem 0; }
    .row > * { flex: 1; min-width: 6rem; }
    .presets button { margin: 0.15rem; }
    hr { margin: 1.25rem 0; }
    #status { color: #444; }
  </style>
</head>
<body>
  <h1>API bench (throwaway)</h1>
  <p id="status">token: nessuno</p>

  <label>Base URL
    <input id="base" type="text" value="" />
  </label>
  <p style="color:#666;font-size:0.9rem">Deve coincidere con l’host della pagina (localhost ≠ 127.0.0.1). Se la bench è servita dall’API, lascia l’origine corrente.</p>

  <div class="row">
    <label>user
      <input id="user" type="text" value="admin" />
    </label>
    <label>pass
      <input id="pass" type="password" value="admin" />
    </label>
    <button type="button" id="btnLogin">Login</button>
    <button type="button" id="btnClear">Clear token</button>
  </div>

  <hr />

  <div class="row">
    <label>method
      <select id="method">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>DELETE</option>
      </select>
    </label>
    <label>path
      <input id="path" type="text" value="/health" />
    </label>
  </div>

  <label>body (JSON)
    <textarea id="body"></textarea>
  </label>

  <button type="button" id="btnSend">Invia</button>

  <hr />
  <p>Preset smoke:</p>
  <div class="presets" id="presets"></div>

  <h2>Response</h2>
  <pre id="out">—</pre>

  <script>
    let token = localStorage.getItem("bench_token") || "";
    const $ = (id) => document.getElementById(id);
    // Same-origin quando la pagina è su /bench o / (evita CORS localhost vs 127.0.0.1)
    $("base").value =
      location.protocol === "http:" || location.protocol === "https:"
        ? location.origin
        : "http://127.0.0.1:8000";
    const setStatus = () => {
      $("status").textContent = token ? "token: presente (" + token.slice(0, 16) + "…)" : "token: nessuno";
    };
    setStatus();

    const presets = [
      { label: "GET /health", method: "GET", path: "/health", body: "" },
      { label: "GET /clienti", method: "GET", path: "/clienti", body: "" },
      { label: "POST /clienti", method: "POST", path: "/clienti",
        body: '{\n  "ragione_sociale": "Acme SpA",\n  "partita_iva": "IT12345678901"\n}' },
      { label: "POST /commesse", method: "POST", path: "/commesse",
        body: '{\n  "cliente_id": 1,\n  "nome": "Impianto A",\n  "descrizione": "test",\n  "stato": "in_corso",\n  "budget": 1000,\n  "lat": 45.46,\n  "lon": 9.19\n}' },
      { label: "POST /ticket", method: "POST", path: "/ticket",
        body: '{\n  "commessa_id": 1,\n  "nome": "Elettrico",\n  "descrizione": "test",\n  "costo_totale": 100,\n  "stato": "in_corso"\n}' },
      { label: "POST /interventi", method: "POST", path: "/interventi",
        body: '{\n  "cliente_id": 1,\n  "ticket_id": 1,\n  "ore_lavorate": 2,\n  "ore_viaggio": 1,\n  "km": 40,\n  "ore_totali": 3,\n  "data": "2026-10-03",\n  "note": "test"\n}' },
      { label: "POST /materiali", method: "POST", path: "/materiali",
        body: '{\n  "nome": "Cavo",\n  "descrizione": "test",\n  "costo_unitario": 5.5,\n  "unita": "m",\n  "fornitore": "X"\n}' },
      { label: "POST /materiali-utilizzati", method: "POST", path: "/materiali-utilizzati",
        body: '{\n  "commessa_id": 1,\n  "materiale_id": 1,\n  "nome": "Cavo",\n  "quantita": 10,\n  "costo_totale": 55\n}' },
      { label: "GET /users", method: "GET", path: "/users", body: "" },
      { label: "POST /users", method: "POST", path: "/users",
        body: '{\n  "username": "tecnico1",\n  "password": "tecnico1",\n  "role": "tecnico",\n  "costo_orario": 25\n}' },
    ];

    const box = $("presets");
    for (const p of presets) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = p.label;
      b.onclick = () => {
        $("method").value = p.method;
        $("path").value = p.path;
        $("body").value = p.body;
      };
      box.appendChild(b);
    }

    async function send(method, path, bodyText, authNeeded) {
      const url = $("base").value.replace(/\/$/, "") + path;
      const headers = { Accept: "application/json" };
      if (authNeeded !== false && token) headers["Authorization"] = "Bearer " + token;
      let body;
      if (method !== "GET" && method !== "DELETE" && bodyText.trim()) {
        headers["Content-Type"] = "application/json";
        body = bodyText;
      }
      let res;
      try {
        res = await fetch(url, { method, headers, body });
      } catch (e) {
        throw new Error(
          "Server non raggiungibile (o origine diversa: controlla Base URL). " + e.message
        );
      }
      const text = await res.text();
      let pretty = text;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
      $("out").textContent = res.status + " " + res.statusText + "\n\n" + pretty;
      return { res, text, pretty };
    }

    $("btnLogin").onclick = async () => {
      try {
        const { res, text } = await send(
          "POST",
          "/login",
          JSON.stringify({ username: $("user").value, password: $("pass").value }),
          false
        );
        if (!res.ok) return;
        const data = JSON.parse(text);
        token = data.access_token || "";
        localStorage.setItem("bench_token", token);
        setStatus();
      } catch (e) {
        $("out").textContent = String(e);
      }
    };

    $("btnClear").onclick = () => {
      token = "";
      localStorage.removeItem("bench_token");
      setStatus();
    };

    $("btnSend").onclick = async () => {
      try {
        await send($("method").value, $("path").value, $("body").value);
      } catch (e) {
        $("out").textContent = String(e);
      }
    };
  </script>
</body>
</html>
